name: Release

# A tag v<version> (for example v0.5.11) builds the Windows installer + zip, the AppImage and an
# ad hoc signed macOS app bundle (zip, Apple silicon) and attaches them to a DRAFT GitHub release;
# the maintainer publishes it after a check.
# Note: deleting a tag on GitHub also drops its draft release and the workflow run made for it, and
# GitHub then listed this workflow as "deleted" until a push to main touched this file again. To drop
# a half-made snapshot, delete the draft release and keep the tag.
# The tag must equal the CMake version (project(VERSION) + TANARA_VERSION_SUFFIX in CMakeLists.txt),
# otherwise the first job fails. The packaging steps are scripts that also run on a developer
# machine: tools/ci/package-windows.ps1, tools/ci/package-appimage.sh (docs/BUILD.md, "Packaging").

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    name: Tag matches the CMake version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      # A version with a letter suffix (TANARA_VERSION_SUFFIX, e.g. 0.5.305a = alpha) is an
      # experimental build: the release is marked pre-release and says so to testers.
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Compare tag and CMake version
        id: v
        run: |
          version="$(bash tools/ci/package-version.sh "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *[a-z]) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)      echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  windows-installer:
    name: Windows installer and zip (MinGW 13.1, Inno Setup)
    needs: check-version
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtmultimedia qtshadertools qttasktree
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true
          # Unreleased aqtinstall with the Qt 6.11 Windows folder-layout fix; see ci.yml.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress -y
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/deps
          key: windows-deps-${{ hashFiles('tools/ci/windows-deps.ps1', 'tools/ci/package-windows.ps1') }}
      - name: Download ONNX Runtime and FFmpeg
        shell: pwsh
        run: ./tools/ci/windows-deps.ps1
      - name: Build, assemble, smoke-test and package
        shell: pwsh
        # Inno Setup 6 is preinstalled on windows-2022; the script installs it with Chocolatey if it is missing.
        run: ./tools/ci/package-windows.ps1 -Tag "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v5
        with:
          name: windows-packages
          path: |
            build-release/Tanara-*-win64.zip
            build-release/Tanara-*-win64-setup.exe
            build-release/*.sha256
          if-no-files-found: error

  appimage:
    name: AppImage (ubuntu-22.04, Qt 6.11)
    needs: check-version
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Install system packages
        run: bash tools/ci/package-appimage.sh --install-deps
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia qtshadertools qttasktree
          cache: true
          # The same aqtinstall commit as the Windows jobs (3.3.0 would work for Linux; one toolchain).
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
      - name: Build the AppImage
        run: bash tools/ci/package-appimage.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v5
        with:
          name: appimage
          path: |
            build-appimage/out/Tanara-*-x86_64.AppImage
            build-appimage/out/*.sha256
          if-no-files-found: error

  macos-bundle:
    name: macOS app bundle (Apple silicon, Homebrew Qt, ad hoc signature)
    needs: check-version
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-macos-15-${{ hashFiles('tools/ci/Brewfile') }}
          restore-keys: brew-macos-15-
      - name: Install dependencies (Homebrew)
        run: brew bundle --file=tools/ci/Brewfile
      - name: Build tanara.app
        # Ninja is enough: the bundle logic (gui/CMakeLists.txt) does not need the Xcode generator.
        # tanara_bundle runs macdeployqt with -codesign=- (ad hoc signature, no notarization).
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DTANARA_MACOS_BUNDLE=ON -DTANARA_BUILD_VOICEID=ON
          cmake --build build -j3 --target tanara_bundle
      - name: Re-sign the bundle (ad hoc)
        # macdeployqt leaves some copied Homebrew dylibs with an invalid signature (libbrotlicommon
        # was reported as "code or signature have been modified"), so the whole bundle is signed
        # again ad hoc after deployment; this is what --verify then checks.
        run: codesign --force --deep --sign - build/gui/tanara.app
      - name: Smoke test
        run: |
          codesign --verify --deep --verbose=2 build/gui/tanara.app
          build/gui/tanara.app/Contents/MacOS/tanara-cli --version
      - name: Zip the bundle
        run: |
          zip="Tanara-${{ needs.check-version.outputs.version }}-macos-arm64.zip"
          mkdir -p out
          ditto -c -k --keepParent build/gui/tanara.app "out/$zip"
          ( cd out && shasum -a 256 "$zip" > "$zip.sha256" )
          ls -l out
      - uses: actions/upload-artifact@v5
        with:
          name: macos-bundle
          path: |
            out/Tanara-*-macos-arm64.zip
            out/*.sha256
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [check-version, windows-installer, appimage, macos-bundle]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release-files
          merge-multiple: true
      - name: List the files
        run: ls -l release-files
      - uses: softprops/action-gh-release@v2
        with:
          name: Tanara ${{ needs.check-version.outputs.version }}${{ needs.check-version.outputs.prerelease == 'true' && ' (kísérleti build)' || '' }}
          draft: true
          # Suffixed version = pre-release: GitHub shows the badge, it never becomes "Latest", and
          # it can be deleted with its tag once the feedback round is over
          # (gh release delete v0.5.305a --cleanup-tag --yes). The assets live on the release,
          # not in the repository history.
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
          body: >-
            ${{ needs.check-version.outputs.prerelease == 'true'
                && 'Kísérleti (alfa) build visszajelzéshez, nem végleges kiadás. Windows: a `-win64-setup.exe` felhasználói telepítő (nincs aláírva, a SmartScreen figyelmeztet); Linux: az AppImage; macOS (Apple silicon): a `-macos-arm64.zip`, ad hoc aláírással, Apple-hitelesítés (notarization) nélkül, ezért az első indításkor jobb klikk → Megnyitás kell (macOS 15-től: Rendszerbeállítások → Adatvédelem és biztonság → Megnyitás mindenképp), vagy `xattr -dr com.apple.quarantine tanara.app`. Ismert korlátok és teendők a csomagban lévő OLVASSEL.md-ben. / Experimental (alpha) build for feedback, not a release. The macOS app is not notarized: open it with right-click → Open (macOS 15 and later: System Settings → Privacy & Security → Open Anyway), or run `xattr -dr com.apple.quarantine tanara.app`.'
                || '' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*
