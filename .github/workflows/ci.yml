name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Fedora 44, full build and tests)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      # The bare container has no git/tar/zstd yet, which checkout and cache need.
      - name: Bootstrap container
        run: dnf install -y --setopt=install_weak_deps=False git tar zstd
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: bash tools/ci/linux-deps.sh
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build and test
        run: bash tools/ci/build-test.sh build
      - name: ccache statistics
        if: always()
        run: ccache -s
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: linux-LastTest.log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  linux-headless:
    name: Linux headless (no GUI, no watcher)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Bootstrap container
        run: dnf install -y --setopt=install_weak_deps=False git tar zstd
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: bash tools/ci/linux-deps.sh
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-headless-${{ github.sha }}
          restore-keys: ccache-linux-headless-
      - name: Build and test
        run: bash tools/ci/build-test.sh build -DTANARA_BUILD_GUI=OFF -DTANARA_BUILD_WATCHER=OFF
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: linux-headless-LastTest.log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  windows:
    name: Windows (MinGW 13.1 from aqtinstall, full build and tests)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: windows
          target: desktop
          arch: win64_mingw
          # qttasktree: Qt 6.11's QmlAssetDownloader (qtdeclarative) depends on it.
          modules: qtmultimedia qtshadertools qttasktree
          tools: tools_mingw1310,qt.tools.win64_mingw1310
          cache: true
          # Qt 6.11 moved the Windows packages into per-arch folders (qt6_6111/qt6_6111_mingw/...);
          # aqtinstall 3.3.0 (the last PyPI release, 2025-06) still asks for qt6_6111/qt6_6111/Updates.xml
          # and fails. The fix (miurahr/aqtinstall#1000, merged 2026-03-24) is unreleased: install that
          # commit. Drop this once a release with it exists (aqtinstall#1007).
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress -y
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/deps
          key: windows-deps-${{ hashFiles('tools/ci/windows-deps.ps1') }}
      - name: Download ONNX Runtime and FFmpeg
        shell: pwsh
        run: ./tools/ci/windows-deps.ps1
      - name: Build and test
        shell: pwsh
        run: ./tools/ci/build-test.ps1
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: windows-LastTest.log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
